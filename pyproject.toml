[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "megalodonte-packaging"
version = "0.1.0"
description = "Shared Python packaging tools for JavaFX applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
megalodonte-package = "megalodonte_packaging.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
